<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Peptide Manager</title>
    <meta name="theme-color" content="#08111f" />
    <meta name="description" content="Registro pessoal de aplicações e ciclos" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css?v=2.27" />
  </head>
  <body>
    <header>
      <div><b>◈ Peptide Manager</b></div>
    </header>
    <main id="app"></main>
    <nav id="bottom-nav">
      <button type="button" data-action="set-tab" data-id="inicio" aria-label="Início">
        Início
      </button>
      <button type="button" data-action="set-tab" data-id="aplicacoes" aria-label="Aplicações">
        Aplicações
      </button>
      <button type="button" data-action="set-tab" data-id="ciclos" aria-label="Ciclos">
        Ciclos
      </button>
      <button type="button" data-action="set-tab" data-id="relatorios" aria-label="Relatórios">
        Relatórios
      </button>
      <button type="button" data-action="set-tab" data-id="configuracoes" aria-label="Ajustes">
        Ajustes
      </button>
    </nav>
    <footer>
      <div>
        <span class="footer-version">v2.27</span>
      </div>
    </footer>
    <dialog id="confirmDialog">
      <h2>Confirmar exclusão</h2>
      <p id="confirmText"></p>
      <p class="warning">
        Esta ação não pode ser desfeita. Faça backup antes de excluir dados importantes.
      </p>
      <div class="row between">
        <button type="button" data-action="close-confirm">Cancelar</button
        ><button class="danger" id="confirmYes">Sim, excluir</button>
      </div>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./app.js?v=2.27" defer></script>
  </body>
</html>
