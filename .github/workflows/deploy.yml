name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Rodar testes
        run: node --experimental-vm-modules --test
      - name: Preparar navegador
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Testar atualização e acesso offline
        run: npm run e2e -- e2e/upgrade.e2e.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Separar arquivos publicados
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest service-worker.js icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png _site/
          cp -r js _site/js
          cp -r screenshots _site/screenshots
          cp -r vendor _site/vendor
          cp -r fonts _site/fonts
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Conferir conteúdo publicado
        run: |
          URL="https://rcx96.github.io/Pepitide-Manager"
          FILES=$(find js -name '*.js' | sort)
          EXPECTED=$(cat $FILES | sha256sum | cut -d' ' -f1)
          CACHE=$(grep -o 'peptide-manager-shell-v[0-9.]*' service-worker.js | head -1 | sed 's/.*-v//')
          echo "sha256 dos módulos js/ no repositório: $EXPECTED / cache do service worker: $CACHE"
          for i in $(seq 1 10); do
            live=$(for f in $FILES; do curl -fsS "$URL/$f?cb=$RANDOM" || exit 1; done | sha256sum | cut -d' ' -f1 || true)
            sw=$(curl -fsS "$URL/service-worker.js?cb=$RANDOM" || true)
            idx=$(curl -fsS "$URL/index.html?cb=$RANDOM" || true)
            if [ "$live" = "$EXPECTED" ] && echo "$sw" | grep -q "shell-v$CACHE" && echo "$idx" | grep -q 'js/main.js'; then
              echo "publicado ok"; exit 0
            fi
            sleep 15
          done
          echo "módulos js/ publicados não conferem com o commit; cache esperado: $CACHE"; exit 1
